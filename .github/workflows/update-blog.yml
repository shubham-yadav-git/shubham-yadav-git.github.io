name: Update blog feed

on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-blog:
    runs-on: ubuntu-latest
    steps:
      - name: Check out site
        uses: actions/checkout@v4

      - name: Update generated blog data
        run: python3 scripts/update-blog.py

      - name: Commit updated blog data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/data/blog.json
          git diff --cached --quiet || git commit -m "Update blog feed"
          git push